name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20. tests/oneFactOneHome.test.mjs imports
          # supabase/functions/_shared/pricing.ts directly — the Deno module is
          # the single home for those constants and a test that re-declared them
          # would defeat its purpose. Importing .ts needs Node's type stripping,
          # which is >= 22.6; on 20 the file fails to load with
          # ERR_UNKNOWN_FILE_EXTENSION before a single assertion runs.
          # This surfaced the first time those tests ever executed in CI.
          node-version: 22
          cache: npm
      - run: npm ci
      # U3 — the saving-sheet engine's pins run BEFORE the build, so a red X on
      # a branch means either the build or the math is broken and merge is
      # blocked either way. node:test, no extra dependency; the harness needs
      # node >= 20.6 for module.register (setup-node's "20" is 20.19+).
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Only main deploys. The `github-pages` environment refuses a deployment from
  # any other branch, so without this guard every claude/** push produced a
  # `deploy` job that failed in ~2 seconds having executed zero steps and been
  # assigned no runner. See the commit that added this line: that failure was
  # invisible for months because `concurrency: cancel-in-progress` cancelled the
  # branch run whenever a main push followed it, so the run was marked
  # `cancelled` before it ever reached `deploy`. Feature branches now build-check
  # only, and a red X on a branch means the BUILD is broken — which is the whole
  # point of having the signal.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
